[project]
name = "veil-studio"
version = "0.1.0"
description = "Local, private, browser-based AI photo editor for boudoir and portrait photographers"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "segno>=1.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
veil = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
