[project]
name = "veil-studio"
version = "0.1.0"
description = "Local, private, browser-based AI photo editor for boudoir and portrait photographers"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "segno>=1.6",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
# the AI editing tools (selection, object removal, background); the models themselves are downloaded from inside Veil
editing = ["torch>=2.5", "torchvision", "opencv-python-headless", "safetensors", "timm", "einops", "kornia", "sam2>=1.1"]
# optional generative fill (Stable Diffusion XL Inpainting)
generative = ["diffusers", "transformers", "accelerate"]
# face tools: also run `pip install --no-deps mediapipe` (it would otherwise replace opencv-python-headless)
faces = ["absl-py", "flatbuffers", "matplotlib", "sounddevice", "cffi"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
veil = ["web/*"]
"veil.vision.vendor" = ["LICENSE-BiRefNet"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
